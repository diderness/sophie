name: Deploy auf Strato (FTP)

# Lädt die Website per FTPS auf den Strato-Webspace. Startet nur per Knopfdruck:
# GitHub → Actions → "Deploy auf Strato (FTP)" → "Run workflow".
# Zugangsdaten kommen aus den Repo-Secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional: Repo-Variable FTP_SERVER_DIR, falls die Website auf dem Webspace in
# einem Unterordner liegt (z. B. "trauredenbysophie/"), sonst der FTP-Hauptordner.
on:
  workflow_dispatch:
    inputs:
      startseite:
        description: "Welche Version hochladen?"
        type: choice
        options:
          - "alt: index_old.html als Startseite, ohne Trauerreden- und Kontaktseite"
          - "neu: index.html mit Trauerreden- und Kontaktseite"
        default: "alt: index_old.html als Startseite, ohne Trauerreden- und Kontaktseite"
      testlauf:
        description: "Nur anzeigen, was hochgeladen würde (nichts ändern)"
        type: boolean
        default: false

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload-Ordner zusammenstellen
        env:
          STARTSEITE: ${{ inputs.startseite }}
        run: |
          mkdir _deploy
          git archive HEAD | tar -x -C _deploy
          cd _deploy
          rm -rf .github .gitignore
          if [[ "$STARTSEITE" == alt* ]]; then
            mv index_old.html index.html
            rm -f trauerreden.html kontakt.html
          else
            rm -f index_old.html
          fi
          echo "Wird hochgeladen:"
          find . -type f | sort

      # Die Action merkt sich in .ftp-deploy-sync-state.json auf dem Server, was sie
      # hochgeladen hat, und löscht nur eigene Dateien. Dateien, die nur auf dem
      # Server liegen (Geschenkseite, secrets/*.json, cache/*.json), bleiben unberührt.
      # Node bricht den IPv4-Verbindungsaufbau sonst nach 250 ms ab, wenn IPv6 auf dem
      # Runner nicht erreichbar ist (ETIMEDOUT ... :21). Darum nur IPv4, normaler Timeout.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          NODE_OPTIONS: --no-network-family-autoselection --dns-result-order=ipv4first
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ inputs.testlauf }}
          exclude: |
            g-fqsscyn21amkybc5/**
            secrets/*.json
            cache/*.json
