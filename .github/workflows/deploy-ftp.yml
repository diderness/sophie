name: Deploy auf Strato (SFTP)

# Lädt die Website per SFTP auf den Strato-Webspace. Startet nur per Knopfdruck:
# GitHub → Actions → "Deploy auf Strato (SFTP)" → "Run workflow".
# Vor jedem Upload wird gesichert, was überschrieben wird (Ordner _versionen/ auf dem
# Server). Mit "zurückschalten" wird eine gesicherte Version wieder live gestellt.
# Zugangsdaten kommen aus den Repo-Secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Die Website liegt auf dem Webspace im Ordner "trauredenbysophie"; abweichend
# lässt sich das mit der Repo-Variable FTP_SERVER_DIR ändern.
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options:
          - "hochladen"
          - "zurückschalten auf gesicherte Version"
        default: "hochladen"
      startseite:
        description: "Beim Hochladen: welche Version?"
        type: choice
        options:
          - "alt: index_old.html als Startseite, ohne Trauerreden- und Kontaktseite"
          - "neu: index.html mit Trauerreden- und Kontaktseite"
        default: "alt: index_old.html als Startseite, ohne Trauerreden- und Kontaktseite"
      version:
        description: "Beim Zurückschalten: Name der Version (leer = die vor dem letzten Upload)"
        type: string
        default: ""
      testlauf:
        description: "Nur anzeigen, was passieren würde (nichts ändern)"
        type: boolean
        default: false

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Sichern und hochladen
        env:
          AKTION: ${{ inputs.aktion }}
          STARTSEITE: ${{ inputs.startseite }}
          VERSION: ${{ inputs.version }}
          TESTLAUF: ${{ inputs.testlauf }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'trauredenbysophie' }}
        run: .github/deploy.sh
